name: Veille Logement Social Quotidienne

on:
  schedule:
    # 7h00 Paris (UTC+2 en été) = 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch: # Permet de lancer le script manuellement depuis GitHub si besoin

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai python-docx requests

      - name: Exécuter la veille et l'envoi Brevo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python script.py
