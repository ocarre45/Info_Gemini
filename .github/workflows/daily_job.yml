name: Veille logement social

on:
  schedule:
    # GitHub Actions planifie en UTC. 05:00 UTC = 07:00 Paris en heure d'été (CEST),
    # 06:00 UTC = 07:00 Paris en heure d'hiver (CET). Les deux plages de mois sont
    # disjointes : une seule exécution par jour, avec un décalage d'une heure
    # pendant les quelques jours entourant les changements d'heure.
    - cron: "0 5 * 4-9 *"
    - cron: "0 6 * 1-3,10-12 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Générer sans envoyer"
        type: boolean
        default: false

concurrency:
  group: veille-logement
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Générer et envoyer la veille
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python veille_logement.py

      - name: Conserver le rendu en cas de dry-run
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: veille-html
          path: veille.html
